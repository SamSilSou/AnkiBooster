<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Booster Logs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  font-family: 'Press Start 2P', monospace;
  background: #111;
  color: #fff;
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

#karaoke-container {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  background: rgba(20,20,20,0.95);
  padding: 20px;
  box-sizing: border-box;
}

#karaoke-container::-webkit-scrollbar {
  width: 8px;
}
#karaoke-container::-webkit-scrollbar-thumb {
  background: #ffcc0080;
  border-radius: 4px;
}

.karaoke-line {
  padding: 18px 0;
  font-size: 14px; /* Tamanho da fonte no sitee de debug*/
  line-height: 1.5em;
  opacity: 0.5;
  transition: opacity 0.3s, transform 0.3s, color 0.3s, text-shadow 0.3s, background 0.3s;
  text-align: center;
  word-break: break-word;
}

.karaoke-line.active {
  opacity: 1;
  font-weight: bold;
  transform: scale(1.2);
  background: linear-gradient(90deg, #ff6ec7, #ffd86e, #6effc7, #6ec7ff, #d86eff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradient 3s infinite linear alternate;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
</style>
</head>
<body>
<div id="karaoke-container">
  <div id="karaoke-scroll"></div>
</div>

<script>
let currentIndex = -1;
let logs = [];
let autoScroll = true;
let userScrollTimeout = null;
let lastCount = 0;

const container = document.getElementById('karaoke-container');
const API = 'http://127.0.0.1:8895/api/logs';

// Detecta scroll manual do usuário
container.addEventListener('scroll', () => {
  autoScroll = false;
  if (userScrollTimeout) clearTimeout(userScrollTimeout);
  userScrollTimeout = setTimeout(() => {
    checkResumeAuto();
  }, 200);
});

// Função que checa se podemos reativar o auto-scroll
function checkResumeAuto() {
  const lines = document.querySelectorAll('.karaoke-line');
  if (!lines[currentIndex]) return;
  
  const line = lines[currentIndex];
  const lineRect = line.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();
  
  const distanceToCenter = Math.abs((lineRect.top + lineRect.bottom)/2 - (containerRect.top + containerRect.bottom)/2);
  
  if (distanceToCenter < 50) {
    autoScroll = true;
    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ✅ CARREGA LOGS DO BOOSTER (no lugar de current_subs.txt)
async function loadLogs() {
  try {
    const res = await fetch(API + '?t=' + Date.now());
    if (!res.ok) throw new Error('Offline');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Resposta inválida');
    return data;
  } catch (e) {
    console.error('❌ Erro ao carregar logs:', e);
    return null;
  }
}

// ✅ RENDERIZA LOGS (adaptado do renderLines)
function renderLogs(newLogs) {
  // Só renderiza se houver novos logs
  if (newLogs.length <= lastCount) return;
  
  logs = newLogs;
  const scrollDiv = document.getElementById('karaoke-scroll');
  
  // Limpa e renderiza todos os logs
  scrollDiv.innerHTML = '';
  logs.forEach(log => {
    const div = document.createElement('div');
    div.className = 'karaoke-line';
    // Mostra: [NÍVEL] mensagem (sem timestamp para manter layout limpo)
    div.textContent = `[${log.level}] ${log.message}`;
    scrollDiv.appendChild(div);
  });
  
  lastCount = logs.length;
}

// ✅ ATUALIZA LINHA ATIVA (sempre a mais recente)
function updateActiveLine() {
  const newIndex = logs.length - 1;  // Última = mais recente
  if (newIndex === currentIndex || newIndex < 0) return;

  document.querySelectorAll('.karaoke-line').forEach(el => el.classList.remove('active'));

  const lines = document.querySelectorAll('.karaoke-line');
  if (lines[newIndex]) {
    lines[newIndex].classList.add('active');
    currentIndex = newIndex;

    // Scroll só se autoScroll ativo
    if (autoScroll) {
      lines[newIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// ✅ POLLING DE LOGS (adaptado do original)
async function poll() {
  const data = await loadLogs();
  if (!data) return;

  renderLogs(data);
  updateActiveLine();
}

// Inicia
poll();
setInterval(poll, 300);  // Mesmo intervalo do original
</script>
</body>
</html>
